name: Auto Commit Speedrun
on:
  schedule:
    # Runs once a day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering
jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Configure Git
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
    - name: Create speedrun checkpoint
      run: |
        set -e  # Exit on error
        
        timestamp=$(date '+%Y-%m-%d %H:%M:%S')
        
        # Ensure we're on the main branch
        git checkout main || git checkout -b main
        
        # Fetch latest changes
        git fetch origin main
        
        # Try to merge/rebase with remote
        if git rev-parse --verify origin/main >/dev/null 2>&1; then
          # Reset to remote main to avoid conflicts
          git reset --hard origin/main || {
            echo "Warning: Could not reset to origin/main, continuing..."
          }
        fi
        
        # Get commit count (handle case where repo might be empty)
        commit_count=$(git rev-list --count HEAD 2>/dev/null || echo "0")
        
        # Create/update checkpoint file in the repository root
        echo "Speedrun checkpoint: $timestamp" > speedrun_checkpoint.txt
        echo "Commit #$commit_count" >> speedrun_checkpoint.txt
        echo "Repository: ${{ github.repository }}" >> speedrun_checkpoint.txt
        echo "Actor: ${{ github.actor }}" >> speedrun_checkpoint.txt
        echo "Workflow Run: ${{ github.run_id }}" >> speedrun_checkpoint.txt
        
        # Add the changes
        git add speedrun_checkpoint.txt
        
        # Check if there are any changes to commit
        if git diff --staged --quiet; then
          echo "No changes detected, creating empty commit..."
          git commit --allow-empty -m "🏃 Speedrun checkpoint: $timestamp (no changes)"
        else
          echo "Changes detected, committing..."
          git commit -m "🏃 Speedrun checkpoint: $timestamp"
        fi
        
        # Push changes with retry logic
        max_retries=3
        retry_count=0
        
        while [ $retry_count -lt $max_retries ]; do
          if git push origin main; then
            echo "Successfully pushed checkpoint"
            exit 0
          else
            retry_count=$((retry_count + 1))
            echo "Push failed (attempt $retry_count/$max_retries), fetching and retrying..."
            
            # Fetch latest changes
            git fetch origin main
            
            # Try to rebase
            if git rebase origin/main; then
              echo "Rebase successful, retrying push..."
            else
              echo "Rebase failed, aborting and resetting..."
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/main
              git add speedrun_checkpoint.txt
              git commit -m "🏃 Speedrun checkpoint: $timestamp" || git commit --allow-empty -m "🏃 Speedrun checkpoint: $timestamp (no changes)"
            fi
          fi
        done
        
        echo "Error: Failed to push after $max_retries attempts"
        exit 1
